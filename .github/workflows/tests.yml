name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # ubuntu-latest (26.04) has no Python 3.9 build any more; 24.04 still has the old and the new one
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install -r requirements.txt flake8
      - name: Tests
        run: python -m pytest -q
      - name: flake8
        run: flake8 --max-line-length 130 hardening_checker tests samples
